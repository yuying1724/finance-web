<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>財務管理</title>
  <meta name="theme-color" content="#f6efdd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#221c15" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="財務管理">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 主題要在畫面出現前就套用，避免閃一下
    (function () {
      try {
        var t = localStorage.getItem('fin.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var u = localStorage.getItem('fin.updown');
        if (u === 'us') document.documentElement.setAttribute('data-updown', 'us');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><div class="boot">載入中…</div></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>此網站需要 JavaScript 才能使用。</noscript>
  <script src="config.js"></script>
  <script src="js/core/money.js"></script>
  <script src="js/core/dates.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
